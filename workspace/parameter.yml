# parameter.yml — fabric-cicd environment parameterisation
# Principle II: Contains secret names only (Key Vault URLs + key names). No secret values.
# Principle VIII: Enables environment-specific deployment without hardcoded strings.
#
# This format is compatible with fabric-cicd versions that expect top-level
# operation keys and environment values nested under replace_value.

find_replace:
  # Lakehouse GUID — substituted into # META default_lakehouse fields in notebooks
  - find_value: "00000000-0000-0000-0000-000000000000"
    replace_value:
      DEV: "$items.Lakehouse.CopilotUsageLakehouse.$id"
      PROD: "$items.Lakehouse.CopilotUsageLakehouse.$id"
    item_type: "Notebook"
    file_path: "**/notebook-content.py"

  # Lakehouse workspace GUID — substituted into # META default_lakehouse_workspace_id
  - find_value: "11111111-1111-1111-1111-111111111111"
    replace_value:
      DEV: "$workspace.$id"
      PROD: "$workspace.$id"
    item_type: "Notebook"
    file_path: "**/notebook-content.py"

  # Key Vault URL by environment
  - find_value: "https://kv-copilot-dev.vault.azure.net"
    replace_value:
      DEV: "https://aiadoption-kv.vault.azure.net/"
      PROD: "https://kv-copilot-prod.vault.azure.net"
    item_type: "Notebook"
    file_path: "**/notebook-content.py"

  # Pipeline notebook references (name -> deployed notebook item ID)
  - find_value: '"notebookId": "00_watermarks"'
    replace_value:
      DEV: '"notebookId": "9fe416df-d3d9-4c6c-9f69-b3ad3f94bc4e"'
      PROD: '"notebookId": "$items.Notebook.00_watermarks.$id"'
    item_type: "DataPipeline"
    file_path: "CopilotUsagePipeline.DataPipeline/pipeline-content.json"

  - find_value: '"notebookId": "01_ingest_users"'
    replace_value:
      DEV: '"notebookId": "546f1423-6b65-4973-a9d6-705bfea71bc5"'
      PROD: '"notebookId": "$items.Notebook.01_ingest_users.$id"'
    item_type: "DataPipeline"
    file_path: "CopilotUsagePipeline.DataPipeline/pipeline-content.json"

  - find_value: '"notebookId": "02_ingest_usage"'
    replace_value:
      DEV: '"notebookId": "5ef05f15-fcb5-4d10-b5a6-f3bd5a6af392"'
      PROD: '"notebookId": "$items.Notebook.02_ingest_usage.$id"'
    item_type: "DataPipeline"
    file_path: "CopilotUsagePipeline.DataPipeline/pipeline-content.json"

  - find_value: '"notebookId": "03_ingest_audit_logs"'
    replace_value:
      DEV: '"notebookId": "7b70ec56-c189-4c1d-a6c8-c953abf04cdd"'
      PROD: '"notebookId": "$items.Notebook.03_ingest_audit_logs.$id"'
    item_type: "DataPipeline"
    file_path: "CopilotUsagePipeline.DataPipeline/pipeline-content.json"

  - find_value: '"notebookId": "04_transform_silver"'
    replace_value:
      DEV: '"notebookId": "0917a6c4-82ec-41dd-868a-82a4f0ef55de"'
      PROD: '"notebookId": "$items.Notebook.04_transform_silver.$id"'
    item_type: "DataPipeline"
    file_path: "CopilotUsagePipeline.DataPipeline/pipeline-content.json"

  - find_value: '"notebookId": "05_transform_gold"'
    replace_value:
      DEV: '"notebookId": "fefff6e0-1ca2-4c1d-b129-029571fcf1b7"'
      PROD: '"notebookId": "$items.Notebook.05_transform_gold.$id"'
    item_type: "DataPipeline"
    file_path: "CopilotUsagePipeline.DataPipeline/pipeline-content.json"

  - find_value: '"notebookId": "06_compute_scores"'
    replace_value:
      DEV: '"notebookId": "f103e36b-393f-4b54-8068-ed6afbb33bf5"'
      PROD: '"notebookId": "$items.Notebook.06_compute_scores.$id"'
    item_type: "DataPipeline"
    file_path: "CopilotUsagePipeline.DataPipeline/pipeline-content.json"

  - find_value: '"notebookId": "99_dq_checks"'
    replace_value:
      DEV: '"notebookId": "4faf0706-042d-4b91-8023-2e4faa49c523"'
      PROD: '"notebookId": "$items.Notebook.99_dq_checks.$id"'
    item_type: "DataPipeline"
    file_path: "CopilotUsagePipeline.DataPipeline/pipeline-content.json"

  # Pipeline workspace references for Trident notebook activities
  - find_value: '"workspaceId": null'
    replace_value:
      DEV: '"workspaceId": "2db2a44c-720a-48bc-afb8-51a9f3b86291"'
      PROD: '"workspaceId": "$workspace.$id"'
    item_type: "DataPipeline"
    file_path: "CopilotUsagePipeline.DataPipeline/pipeline-content.json"

key_value_replace:
  # Daily schedule toggle per environment
  - find_key: "$.schedules[*].enabled"
    replace_value:
      DEV: false
      PROD: true
    item_type: "DataPipeline"
    file_path: "CopilotUsagePipeline.DataPipeline/pipeline-content.json"
